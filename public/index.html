<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clawd Deck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦞</text></svg>">
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
<link rel="stylesheet" href="/style.css">
<script>/* before first paint, so a dark preference never flashes light */
if (localStorage.getItem('deckTheme') === 'dark') document.documentElement.classList.add('dark');</script>
</head>
<body>

<header id="topbar">
  <div class="brand">🦞 <strong>Clawd Deck</strong></div>
  <div id="counts" class="counts"></div>
  <select id="sortSel" class="ctl" title="Order the session cards">
    <option value="attention">Sort: needs attention</option>
    <option value="activity">Sort: recent activity</option>
    <option value="name">Sort: name</option>
    <option value="context">Sort: context used</option>
  </select>
  <button id="newSession" class="ctl btn-new" title="Start a new Claude session you can type into right here">+ New session</button>
  <button id="themeToggle" class="ctl" title="Switch between light and dark. The embedded terminals follow."></button>
  <button id="sideToggle" class="ctl"></button>
  <label class="toggle" title="When a session ends, a background Claude reads it and saves anything worth remembering. Each session close costs one short run, so leave this off unless you want it.">
    <input type="checkbox" id="autoNudge"> auto-memory on session end
  </label>
</header>

<main>
  <section id="grid" aria-label="Sessions"></section>

  <aside id="sidebar">
    <nav class="tabs">
      <button data-tab="todos" class="active">To-dos</button>
      <button data-tab="artifacts">Artifacts</button>
      <button data-tab="prs">PRs</button>
    </nav>
    <div id="tab-todos" class="tab-panel active"></div>
    <div id="tab-artifacts" class="tab-panel"></div>
    <div id="tab-prs" class="tab-panel"></div>
  </aside>
</main>

<div id="detail" class="hidden">
  <header>
    <button id="detail-close" title="Back to grid">←</button>
    <div id="detail-title"></div>
    <div id="detail-meta"></div>
    <button id="convo-toggle" class="mini hidden">copy-paste view</button>
  </header>
  <div id="detail-note" class="hidden"></div>
  <div class="panes">
    <div id="term-pane" class="hidden">
      <div id="term"></div>
      <div id="term-bar" class="hidden" title="Drag to scroll through the session">
        <div id="term-bar-thumb"></div>
      </div>
    </div>
    <div id="convo-pane">
      <div class="pane-head">Conversation <span class="hint">· the copy buttons give you clean text, exactly as written</span></div>
      <div id="convo"></div>
    </div>
  </div>
</div>

<div id="ns-overlay" class="hidden">
  <div id="ns-dialog">
    <h3>New session</h3>
    <label>Folder
      <input id="ns-cwd" placeholder="type a path or browse below" autocomplete="off" spellcheck="false">
    </label>
    <div id="ns-browse">
      <div id="ns-recent-head" class="ns-sect">recent projects</div>
      <div id="ns-recent"></div>
      <div id="ns-divider" title="Drag to give the two lists more or less room"></div>
      <div id="ns-browse-here" class="ns-sect"></div>
      <div id="ns-browse-list"></div>
    </div>
    <label>Name
      <input id="ns-name" placeholder="what this session is for" autocomplete="off">
    </label>
    <label id="ns-acct-wrap" class="hidden">Account
      <select id="ns-acct"></select>
    </label>
    <div id="ns-err"></div>
    <div class="ns-row">
      <button id="ns-cancel" class="mini">cancel</button>
      <button id="ns-go" class="mini primary">Start session</button>
    </div>
  </div>
</div>

<div id="disconnected" class="hidden">Lost the server. Retrying…</div>

<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/addon-fit/lib/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
